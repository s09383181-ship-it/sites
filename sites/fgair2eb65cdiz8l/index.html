<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<meta name="theme-color" content="#0f0c29">
<title>موقتاً در دسترس نیست</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html {
    height: 100%;
    font-size: 16px;
  }

  body {
    min-height: 100vh;
    min-height: 100dvh;
    width: 100%;
    font-family: 'Vazirmatn', Tahoma, sans-serif;
    background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    position: relative;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }

  body::before,
  body::after {
    content: '';
    position: fixed;
    border-radius: 50%;
    filter: blur(90px);
    opacity: 0.45;
    pointer-events: none;
    z-index: 0;
  }

  body::before {
    width: 340px;
    height: 340px;
    background: #ff2d95;
    top: -120px;
    right: -120px;
    animation: float 9s ease-in-out infinite;
  }

  body::after {
    width: 380px;
    height: 380px;
    background: #00c6ff;
    bottom: -140px;
    left: -140px;
    animation: float 11s ease-in-out infinite reverse;
  }

  @keyframes float {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50%      { transform: translate(20px, -20px) scale(1.08); }
  }

  .card {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 520px;
    padding: 40px 28px;
    background: rgba(255, 255, 255, 0.08);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 24px;
    box-shadow:
      0 20px 50px rgba(0, 0, 0, 0.45),
      inset 0 1px 0 rgba(255, 255, 255, 0.15);
    text-align: center;
    color: #fff;
    animation: slideUp 0.7s cubic-bezier(0.22, 1, 0.36, 1);
  }

  @keyframes slideUp {
    from { opacity: 0; transform: translateY(24px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .icon-wrap {
    width: 84px;
    height: 84px;
    margin: 0 auto 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    background: linear-gradient(135deg, #ff2d95, #7b2ff7);
    box-shadow: 0 12px 30px rgba(255, 45, 149, 0.45);
    animation: pulse 2.6s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { box-shadow: 0 12px 30px rgba(255, 45, 149, 0.45); }
    50%      { box-shadow: 0 12px 42px rgba(255, 45, 149, 0.8); }
  }

  .icon-wrap svg {
    width: 42px;
    height: 42px;
    stroke: #fff;
    stroke-width: 2;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  h1 {
    font-size: 1.35rem;
    font-weight: 900;
    line-height: 1.7;
    margin-bottom: 14px;
    background: linear-gradient(135deg, #ffffff 0%, #c4bdff 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    color: transparent;
  }

  p {
    font-size: 0.98rem;
    line-height: 2;
    color: rgba(255, 255, 255, 0.85);
    margin-bottom: 26px;
    font-weight: 500;
  }

  .link-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    padding: 14px 20px;
    font-family: inherit;
    font-size: 1rem;
    font-weight: 700;
    color: #fff;
    text-decoration: none;
    background: linear-gradient(135deg, #ff2d95 0%, #7b2ff7 100%);
    border-radius: 50px;
    box-shadow: 0 10px 26px rgba(123, 47, 247, 0.5);
    transition: transform 0.25s ease, box-shadow 0.25s ease;
    direction: ltr;
    letter-spacing: 0.4px;
    word-break: break-all;
    -webkit-tap-highlight-color: transparent;
  }

  .link-btn:hover,
  .link-btn:focus {
    transform: translateY(-3px);
    box-shadow: 0 14px 36px rgba(255, 45, 149, 0.7);
    outline: none;
  }

  .link-btn:active {
    transform: translateY(-1px);
  }

  .link-btn svg {
    width: 19px;
    height: 19px;
    stroke: #fff;
    stroke-width: 2.2;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
    flex-shrink: 0;
  }

  .footer-note {
    margin-top: 22px;
    font-size: 0.82rem;
    color: rgba(255, 255, 255, 0.55);
    font-weight: 500;
  }

  /* موبایل کوچک */
  @media (max-width: 420px) {
    .card {
      padding: 32px 18px;
      border-radius: 20px;
    }
    .icon-wrap {
      width: 72px;
      height: 72px;
      margin-bottom: 18px;
    }
    .icon-wrap svg {
      width: 36px;
      height: 36px;
    }
    h1 { font-size: 1.2rem; }
    p  { font-size: 0.92rem; }
    .link-btn { font-size: 0.92rem; padding: 13px 16px; }
  }

  /* دسکتاپ بزرگ */
  @media (min-width: 768px) {
    .card { padding: 52px 44px; }
    h1    { font-size: 1.6rem; }
    p     { font-size: 1.05rem; }
    .icon-wrap { width: 96px; height: 96px; }
    .icon-wrap svg { width: 48px; height: 48px; }
  }

  /* ارتفاع کم (لنداسکیپ موبایل) */
  @media (max-height: 560px) {
    .card { padding: 24px 20px; }
    .icon-wrap { width: 60px; height: 60px; margin-bottom: 14px; }
    .icon-wrap svg { width: 30px; height: 30px; }
    h1 { font-size: 1.1rem; margin-bottom: 10px; }
    p  { font-size: 0.88rem; margin-bottom: 18px; line-height: 1.8; }
    .link-btn { padding: 11px 18px; font-size: 0.9rem; }
    .footer-note { margin-top: 14px; }
  }
</style>
</head>
<body>
  <main class="card">
    <div class="icon-wrap">
      <svg viewBox="0 0 24 24">
        <path d="M12 8v4"/>
        <path d="M12 16h.01"/>
        <path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
      </svg>
    </div>

    <h1>این سایت موقتاً از دسترس خارج شده است</h1>

    <p>
      این سایت توسط صاحب کانال فعلاً از دسترس خارج شده.<br>
      لطفاً به آدرس زیر مراجعه کنید:
    </p>

    <a class="link-btn" href="https://b2n.ir/TNT1MOD" target="_blank" rel="noopener noreferrer">
      <svg viewBox="0 0 24 24">
        <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
        <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
      </svg>
      b2n.ir/TNT1MOD
    </a>

    <div class="footer-note">با تشکر از همراهی شما 🙏</div>
  </main>
</body>
</html>
