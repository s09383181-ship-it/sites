<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>موقتاً در دسترس نیست</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    height: 100%;
    font-family: 'Vazirmatn', Tahoma, sans-serif;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    min-height: 100dvh;
    padding: 20px;
    background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
    position: relative;
    overflow: hidden;
  }

  /* حباب‌های تزئینی پس‌زمینه */
  body::before,
  body::after {
    content: '';
    position: absolute;
    border-radius: 50%;
    filter: blur(80px);
    opacity: 0.5;
    z-index: 0;
  }

  body::before {
    width: 400px;
    height: 400px;
    background: #ff2d95;
    top: -100px;
    right: -100px;
    animation: float 8s ease-in-out infinite;
  }

  body::after {
    width: 500px;
    height: 500px;
    background: #00c6ff;
    bottom: -150px;
    left: -150px;
    animation: float 10s ease-in-out infinite reverse;
  }

  @keyframes float {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(30px, -30px) scale(1.1); }
  }

  .card {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 560px;
    padding: 48px 36px;
    background: rgba(255, 255, 255, 0.08);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 28px;
    box-shadow: 0 25px 60px rgba(0, 0, 0, 0.45),
                inset 0 1px 0 rgba(255, 255, 255, 0.15);
    text-align: center;
    color: #fff;
    animation: slideUp 0.7s cubic-bezier(0.22, 1, 0.36, 1);
  }

  @keyframes slideUp {
    from {
      opacity: 0;
      transform: translateY(30px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  .icon-wrap {
    width: 96px;
    height: 96px;
    margin: 0 auto 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    background: linear-gradient(135deg, #ff2d95, #7b2ff7);
    box-shadow: 0 15px 35px rgba(255, 45, 149, 0.4);
    animation: pulse 2.5s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { box-shadow: 0 15px 35px rgba(255, 45, 149, 0.4); }
    50% { box-shadow: 0 15px 50px rgba(255, 45, 149, 0.75); }
  }

  .icon-wrap svg {
    width: 48px;
    height: 48px;
    stroke: #fff;
    stroke-width: 2;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  h1 {
    font-size: clamp(1.4rem, 4.5vw, 1.85rem);
    font-weight: 900;
    margin-bottom: 16px;
    line-height: 1.5;
    background: linear-gradient(135deg, #fff 0%, #b8b0ff 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  p {
    font-size: clamp(0.95rem, 3.5vw, 1.05rem);
    line-height: 1.9;
    color: rgba(255, 255, 255, 0.82);
    margin-bottom: 28px;
    font-weight: 500;
  }

  .link-btn {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 14px 28px;
    font-family: inherit;
    font-size: clamp(0.95rem, 3.5vw, 1.05rem);
    font-weight: 700;
    color: #fff;
    text-decoration: none;
    background: linear-gradient(135deg, #ff2d95 0%, #7b2ff7 100%);
    border-radius: 50px;
    box-shadow: 0 10px 30px rgba(123, 47, 247, 0.5);
    transition: transform 0.25s ease, box-shadow 0.25s ease, letter-spacing 0.25s ease;
    direction: ltr;
    letter-spacing: 0.5px;
    word-break: break-all;
  }

  .link-btn:hover,
  .link-btn:focus {
    transform: translateY(-3px) scale(1.03);
    box-shadow: 0 15px 40px rgba(255, 45, 149, 0.65);
    letter-spacing: 1px;
  }

  .link-btn:active {
    transform: translateY(-1px) scale(1);
  }

  .link-btn svg {
    width: 20px;
    height: 20px;
    stroke: #fff;
    stroke-width: 2.2;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
    flex-shrink: 0;
  }

  .footer-note {
    margin-top: 28px;
    font-size: 0.85rem;
    color: rgba(255, 255, 255, 0.5);
    font-weight: 500;
  }

  @media (max-width: 480px) {
    .card {
      padding: 36px 22px;
      border-radius: 22px;
    }
    .icon-wrap {
      width: 80px;
      height: 80px;
      margin-bottom: 20px;
    }
    .icon-wrap svg {
      width: 40px;
      height: 40px;
    }
    body::before,
    body::after {
      width: 250px;
      height: 250px;
      filter: blur(60px);
    }
    .link-btn {
      padding: 13px 22px;
      width: 100%;
      justify-content: center;
    }
  }
</style>
</head>
<body>
  <main class="card">
    <div class="icon-wrap">
      <svg viewBox="0 0 24 24">
        <path d="M12 8v4"/>
        <path d="M12 16h.01"/>
        <path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
      </svg>
    </div>

    <h1>این سایت موقتاً از دسترس خارج شده است</h1>

    <p>
      این سایت توسط صاحب کانال فعلاً از دسترس خارج شده.<br>
      لطفاً به آدرس زیر مراجعه کنید.
    </p>

    <a class="link-btn" href="https://b2n.ir/TNT1MOD" target="_blank" rel="noopener noreferrer">
      <svg viewBox="0 0 24 24">
        <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
        <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
      </svg>
      b2n.ir/TNT1MOD
    </a>

    <div class="footer-note">با تشکر از همراهی شما 🙏</div>
  </main>
</body>
</html>
