<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>TNT Chat</title>
<script src="https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap');
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Vazirmatn',Tahoma,sans-serif;background:linear-gradient(135deg,#0f0c29,#302b63,#24243e);color:#fff;height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
#login{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:16px;padding:20px}
#login h1{font-size:28px;color:#ffb300}
#login input{width:100%;max-width:280px;padding:14px;border:1px solid rgba(255,255,255,.2);border-radius:14px;background:rgba(255,255,255,.08);color:#fff;font-size:16px;outline:none}
#login button{width:100%;max-width:280px;padding:14px;border:none;border-radius:14px;background:linear-gradient(90deg,#ff5722,#ffb300);color:#000;font-weight:700;font-size:16px;cursor:pointer}
#app{display:none;flex-direction:column;height:100%}
header{background:rgba(15,12,41,.92);padding:12px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid rgba(255,255,255,.1)}
header strong{color:#ffb300;font-size:17px}
.tabs{display:flex;background:rgba(15,12,41,.85);border-bottom:1px solid rgba(255,255,255,.1)}
.tab{flex:1;text-align:center;padding:12px 6px;font-weight:600;color:#aaa;cursor:pointer;font-size:13px}
.tab.active{color:#ffb300;border-bottom:3px solid #ffb300}
#content{flex:1;overflow:hidden;display:flex;flex-direction:column}
.panel{display:none;flex:1;flex-direction:column;overflow:hidden}
.panel.active{display:flex}
.messages{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:80%;padding:10px 14px;border-radius:16px;font-size:15px;line-height:1.4;word-break:break-word}
.msg.me{align-self:flex-start;background:linear-gradient(135deg,#ff8f00,#ff5722)}
.msg.other{align-self:flex-end;background:rgba(255,255,255,.1)}
.msg .meta{font-size:11px;opacity:.8;margin-bottom:3px}
.msg img{max-width:100%;border-radius:10px;margin-top:6px;display:block}
.msg audio{width:100%;margin-top:6px;height:36px}
.post{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:16px;overflow:hidden;margin-bottom:8px}
.post img{width:100%;max-height:280px;object-fit:cover;display:block;background:#1a1a2e}
.post .body{padding:12px}
.post .text{font-size:15px;margin-bottom:6px;white-space:pre-wrap}
.post .meta{font-size:11px;color:#aaa}
.channel-item,.user-item{display:flex;align-items:center;gap:12px;padding:12px;margin:6px 8px;background:rgba(255,255,255,.07);border-radius:14px;cursor:pointer;border:1px solid rgba(255,255,255,.1)}
.channel-item img,.user-item .avatar{width:48px;height:48px;border-radius:50%;object-fit:cover;background:#1a1a2e;flex-shrink:0}
.input-area{padding:8px 10px 12px;background:rgba(15,12,41,.95);border-top:1px solid rgba(255,255,255,.1);display:flex;flex-direction:column;gap:6px}
.input-row{display:flex;gap:6px;align-items:center}
.input-row input{flex:1;padding:11px 14px;border-radius:24px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);color:#fff;font-size:15px;outline:none;min-width:0}
.icon-btn{width:40px;height:40px;border:none;border-radius:50%;background:rgba(255,255,255,.1);color:#fff;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.send-btn{width:44px;height:44px;border:none;border-radius:50%;background:linear-gradient(135deg,#ff5722,#ffb300);color:#000;font-size:18px;font-weight:bold;cursor:pointer;flex-shrink:0}
.emoji-bar{display:none;flex-wrap:wrap;gap:6px;padding:8px;background:rgba(0,0,0,.3);border-radius:12px;max-height:110px;overflow-y:auto}
.emoji-bar.show{display:flex}
.emoji-bar span{font-size:22px;cursor:pointer;padding:3px}
#banOverlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.93);z-index:9999;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px}
#banOverlay h2{color:#ef5350;font-size:24px}
.empty{text-align:center;padding:40px;color:#aaa;font-size:14px}
.status,.conn{text-align:center;padding:5px;font-size:12px;color:#aaa}
#preview{display:none}
#preview img{max-height:70px;border-radius:8px;margin:4px}
.profile-box{padding:20px;text-align:center}
.profile-box input,.profile-box textarea{width:100%;max-width:300px;padding:12px;margin:8px 0;border-radius:12px;border:1px solid rgba(255,255,255,.2);background:rgba(0,0,0,.3);color:#fff;font-size:14px}
.profile-box button{margin-top:12px;padding:12px 28px;border:none;border-radius:12px;background:linear-gradient(90deg,#ff5722,#ffb300);color:#000;font-weight:600;font-size:15px;cursor:pointer}
</style>
</head>
<body>
<div id="banOverlay">
  <h2>شما مسدود شده‌اید</h2>
  <p style="color:#ccc;margin-top:12px">تا رفع مسدودیت نمی‌توانید استفاده کنید.</p>
</div>

<div id="login">
  <h1>TNT Chat</h1>
  <input type="text" id="username" placeholder="نام کاربری" maxlength="18" autocomplete="username">
  <button onclick="doLogin()">ورود</button>
  <div class="conn" id="loginHint"></div>
</div>

<div id="app">
  <header>
    <strong>TNT Chat</strong>
    <span id="userLabel" style="font-size:13px;color:#aaa"></span>
  </header>
  <div class="tabs">
    <div class="tab active" data-tab="group" onclick="switchTab('group')">گروه</div>
    <div class="tab" data-tab="channels" onclick="switchTab('channels')">کانال</div>
    <div class="tab" data-tab="users" onclick="switchTab('users')">کاربران</div>
    <div class="tab" data-tab="profile" onclick="switchTab('profile')">پروفایل</div>
  </div>
  <div class="conn" id="connStatus">در حال اتصال...</div>
  <div id="content">

    <!-- گروه -->
    <div class="panel active" id="panel-group">
      <div class="status" id="gStatus">گروه باز است</div>
      <div class="messages" id="gMsgs"><div class="empty">در حال بارگذاری...</div></div>
      <div class="input-area">
        <div id="preview"></div>
        <div class="emoji-bar" id="emojiBar"></div>
        <div class="input-row">
          <button class="icon-btn" onclick="toggleEmoji()">😀</button>
          <button class="icon-btn" onclick="document.getElementById('fileInput').click()">📷</button>
          <button class="icon-btn" id="voiceBtn" onclick="toggleVoice()">🎤</button>
          <input type="text" id="gText" placeholder="پیام..." onkeydown="if(event.key==='Enter')sendGroup()">
          <button class="send-btn" onclick="sendGroup()">➤</button>
        </div>
        <input type="file" id="fileInput" accept="image/*" style="display:none" onchange="handleFile(this)">
      </div>
    </div>

    <!-- کانال -->
    <div class="panel" id="panel-channels">
      <div id="chList" style="flex:1;overflow-y:auto;padding-top:8px"></div>
      <div id="chView" style="display:none;flex-direction:column;height:100%">
        <div style="padding:12px;background:rgba(15,12,41,.9);display:flex;align-items:center;gap:12px;border-bottom:1px solid rgba(255,255,255,.1)">
          <button onclick="closeChannel()" style="background:none;border:none;color:#ffb300;font-size:22px;cursor:pointer">→</button>
          <img id="chAvatar" style="width:42px;height:42px;border-radius:50%;object-fit:cover;background:#1a1a2e;display:none">
          <div>
            <div id="chTitle" style="font-weight:600;font-size:15px"></div>
            <div id="chDesc" style="font-size:12px;color:#aaa"></div>
          </div>
        </div>
        <div class="messages" id="chMsgs"></div>
      </div>
    </div>

    <!-- کاربران -->
    <div class="panel" id="panel-users">
      <div id="userList" class="messages" style="padding:8px"><div class="empty">در حال بارگذاری کاربران...</div></div>
      <div id="pvView" style="display:none;flex-direction:column;height:100%">
        <div style="padding:12px;background:rgba(15,12,41,.9);display:flex;align-items:center;gap:10px;border-bottom:1px solid rgba(255,255,255,.1)">
          <button onclick="closePv()" style="background:none;border:none;color:#ffb300;font-size:22px;cursor:pointer">→</button>
          <span id="pvTitle" style="font-weight:600"></span>
        </div>
        <div class="messages" id="pvMsgs"></div>
        <div class="input-area">
          <div class="input-row">
            <input type="text" id="pvText" placeholder="پیام خصوصی..." onkeydown="if(event.key==='Enter')sendPv()">
            <button class="send-btn" onclick="sendPv()">➤</button>
          </div>
        </div>
      </div>
    </div>

    <!-- پروفایل -->
    <div class="panel" id="panel-profile">
      <div class="profile-box">
        <h3 style="color:#ffb300;margin-bottom:16px">پروفایل من</h3>
        <input type="text" id="myName" placeholder="نام نمایشی">
        <textarea id="myBio" placeholder="بیو..." rows="3"></textarea>
        <button onclick="saveProfile()">ذخیره پروفایل</button>
      </div>
    </div>

  </div>
</div>

<script>
const BROKER = 'wss://broker.emqx.io:8084/mqtt';
const TG_LIVE = 'tnt/v8/group/live';
const TG_MSG  = 'tnt/v8/group/msg/';
const TC_LIVE = 'tnt/v8/ch/live/';
const TC_POST = 'tnt/v8/ch/post/';
const TK      = 'tnt/v8/ctrl';
const T_PROFILE = 'tnt/v8/profile/main';
const T_USER = 'tnt/v8/user/';
const T_PV = 'tnt/v8/pv/';

const EMOJIS = ['😀','😂','🤣','😍','🥰','😎','🤩','😭','😡','👍','👎','❤️','🔥','✨','🎉','🙏','👏','💪','🤔','😴','🥳','😇','🤗','😋','😜','💀','🌸','⭐','💯','✅','⚡','🎯','🚀','🎵','🎮','🍕','☕'];

let client, username = '', myId = '', banned = false, groupOpen = true;
let currentCh = null, currentPv = null;
let gHistory = [], chHistory = {}, channels = {}, users = {}, pvHistory = {}, seen = new Set();
let myProfile = { name: '', bio: '' };
let mediaRecorder, audioChunks = [], isRecording = false;

function sanitize(n) {
  return String(n || '').replace(/[\u200B-\u200D\uFEFF\u2060]/g, '').trim().slice(0, 18);
}

function save() {
  try {
    localStorage.setItem('t8g', JSON.stringify(gHistory.slice(-150)));
    localStorage.setItem('t8h', JSON.stringify(chHistory));
    localStorage.setItem('t8c', JSON.stringify(channels));
    localStorage.setItem('t8u', username);
    localStorage.setItem('t8p', JSON.stringify(myProfile));
  } catch(e) {}
}

function load() {
  try {
    const g = localStorage.getItem('t8g');
    const h = localStorage.getItem('t8h');
    const c = localStorage.getItem('t8c');
    const p = localStorage.getItem('t8p');
    if (g) gHistory = JSON.parse(g) || [];
    if (h) chHistory = JSON.parse(h) || {};
    if (c) channels = JSON.parse(c) || {};
    if (p) myProfile = JSON.parse(p) || { name: '', bio: '' };
  } catch(e) {}
  if (!channels.main) {
    channels.main = { id: 'main', name: 'کانال اصلی', desc: 'کانال رسمی', avatar: null, official: true };
  }
}

function doLogin() {
  const u = sanitize(document.getElementById('username').value);
  if (u.length < 2) return alert('نام کاربری حداقل ۲ حرف باشد');
  username = u;
  localStorage.setItem('t8u', username);
  document.getElementById('login').style.display = 'none';
  document.getElementById('app').style.display = 'flex';
  document.getElementById('userLabel').textContent = username;
  load();
  gHistory.forEach(m => seen.add(m.id));
  (chHistory.main || []).forEach(m => seen.add(m.id));
  document.getElementById('myName').value = myProfile.name || username;
  document.getElementById('myBio').value = myProfile.bio || '';
  document.getElementById('emojiBar').innerHTML = EMOJIS.map(e => `<span onclick="insertEmoji('${e}')">${e}</span>`).join('');
  renderChannels();
  renderGroup();
  connect();
}

function connect() {
  myId = 'u_' + username + '_' + Math.random().toString(16).slice(2, 8);
  client = mqtt.connect(BROKER, {
    clientId: myId,
    clean: true,
    reconnectPeriod: 2000,
    connectTimeout: 12000
  });

  client.on('connect', () => {
    document.getElementById('connStatus').textContent = 'متصل ✓';
    document.getElementById('connStatus').style.color = '#81c784';
    client.subscribe([
      TG_LIVE, TG_MSG + '#',
      TC_LIVE + 'main', TC_POST + '#',
      TK, T_PROFILE, T_USER + '#'
    ], { qos: 1 });
    // اعلام حضور و پروفایل
    publishMyProfile();
  });

  client.on('message', (topic, payload) => {
    try {
      const d = JSON.parse(payload.toString());
      if (topic === TG_LIVE || topic.startsWith(TG_MSG)) onGroup(d);
      else if (topic.startsWith(TC_LIVE) || topic.startsWith(TC_POST)) onChannelPost(d);
      else if (topic === TK) onCtrl(d);
      else if (topic === T_PROFILE && d.info) {
        channels.main = d.info;
        save();
        renderChannels();
        if (currentCh === 'main') updateChannelHeader();
      }
      else if (topic.startsWith(T_USER) && d.user && d.user !== username) {
        users[d.user] = d;
        if (document.getElementById('panel-users').classList.contains('active')) renderUsers();
      }
      else if (topic.startsWith(T_PV)) onPrivate(d);
    } catch(e) {}
  });
}

function publishMyProfile() {
  if (!client || !client.connected) return;
  const data = {
    user: username,
    name: myProfile.name || username,
    bio: myProfile.bio || '',
    ts: Date.now()
  };
  client.publish(T_USER + username, JSON.stringify(data), { qos: 1, retain: true });
}

function onGroup(d) {
  if (banned || !d || !d.id || seen.has(d.id)) return;
  // فیلتر پیام‌های خراب
  if (!d.user || (!d.text && !d.data && d.type !== 'voice' && d.type !== 'image')) return;
  seen.add(d.id);
  gHistory.push(d);
  gHistory.sort((a, b) => a.ts - b.ts);
  if (gHistory.length > 150) gHistory = gHistory.slice(-150);
  save();
  addGroupBubble(d);
}

function onChannelPost(d) {
  if (banned || !d || !d.id || seen.has(d.id)) return;
  // فقط پست‌های معتبر
  if (!d.text && !d.img) return;
  seen.add(d.id);
  if (!chHistory.main) chHistory.main = [];
  chHistory.main.push(d);
  chHistory.main.sort((a, b) => a.ts - b.ts);
  if (chHistory.main.length > 60) chHistory.main = chHistory.main.slice(-60);
  save();
  if (currentCh === 'main') renderChannelPosts();
}

function onCtrl(d) {
  if (d.t === 'ban' && Array.isArray(d.users) && d.users.includes(username)) {
    banned = true;
    document.getElementById('banOverlay').style.display = 'flex';
    document.getElementById('app').style.display = 'none';
    try { client.end(true); } catch(e) {}
    return;
  }
  if (d.t === 'gs') {
    groupOpen = !!d.open;
    document.getElementById('gStatus').textContent = groupOpen ? 'گروه باز است' : 'گروه بسته است';
  }
  if (d.t === 'ci' && d.info) {
    channels[d.info.id] = d.info;
    save();
    renderChannels();
  }
}

function onPrivate(d) {
  if (!d || !d.id || !d.from || !d.to) return;
  const other = d.from === username ? d.to : d.from;
  if (!pvHistory[other]) pvHistory[other] = [];
  if (pvHistory[other].some(m => m.id === d.id)) return;
  pvHistory[other].push(d);
  if (currentPv === other) renderPvMessages(other);
}

function renderGroup() {
  const box = document.getElementById('gMsgs');
  box.innerHTML = '';
  if (!gHistory.length) {
    box.innerHTML = '<div class="empty">هنوز پیامی نیست</div>';
    return;
  }
  gHistory.forEach(m => addGroupBubble(m, true));
}

function addGroupBubble(d, silent) {
  const box = document.getElementById('gMsgs');
  if (document.getElementById('g-' + d.id)) return;
  const empty = box.querySelector('.empty');
  if (empty) empty.remove();
  const div = document.createElement('div');
  div.className = 'msg ' + (d.user === username ? 'me' : 'other');
  div.id = 'g-' + d.id;
  let html = `<div class="meta">${esc(d.user)} · ${new Date(d.ts).toLocaleTimeString('fa-IR')}</div>`;
  if (d.type === 'image' && d.data) {
    html += `<div>${esc(d.text || '')}</div><img src="${d.data}" alt="تصویر">`;
  } else if (d.type === 'voice' && d.data) {
    html += `<div>پیام صوتی</div><audio controls src="${d.data}"></audio>`;
  } else {
    html += `<div>${esc(d.text || '')}</div>`;
  }
  div.innerHTML = html;
  box.appendChild(div);
  if (!silent) box.scrollTop = box.scrollHeight;
}

function renderChannels() {
  const list = document.getElementById('chList');
  list.innerHTML = '';
  Object.values(channels).forEach(ch => {
    const div = document.createElement('div');
    div.className = 'channel-item';
    div.onclick = () => openChannel(ch.id);
    const av = ch.avatar
      ? `<img src="${ch.avatar}" alt="avatar">`
      : `<div style="width:48px;height:48px;border-radius:50%;background:#1a1a2e;border:2px solid #ffb300;display:flex;align-items:center;justify-content:center;font-size:18px">✓</div>`;
    div.innerHTML = `${av}<div><div style="font-weight:600">${esc(ch.name || 'کانال')} ${ch.official ? '✓' : ''}</div><div style="font-size:12px;color:#aaa">${esc(ch.desc || '')}</div></div>`;
    list.appendChild(div);
  });
}

function openChannel(id) {
  currentCh = id;
  document.getElementById('chList').style.display = 'none';
  document.getElementById('chView').style.display = 'flex';
  updateChannelHeader();
  renderChannelPosts();
}

function updateChannelHeader() {
  const ch = channels[currentCh] || { name: 'کانال', desc: '', avatar: null };
  document.getElementById('chTitle').textContent = (ch.name || 'کانال') + (ch.official ? ' ✓' : '');
  document.getElementById('chDesc').textContent = ch.desc || '';
  const img = document.getElementById('chAvatar');
  if (ch.avatar) {
    img.src = ch.avatar;
    img.style.display = 'block';
  } else {
    img.style.display = 'none';
  }
}

function closeChannel() {
  currentCh = null;
  document.getElementById('chView').style.display = 'none';
  document.getElementById('chList').style.display = 'block';
  renderChannels();
}

function renderChannelPosts() {
  const box = document.getElementById('chMsgs');
  box.innerHTML = '';
  const posts = (chHistory.main || []).filter(p => p && (p.text || p.img));
  if (!posts.length) {
    box.innerHTML = '<div class="empty">هنوز پستی نیست</div>';
    return;
  }
  posts.forEach(p => {
    if (document.getElementById('cp-' + p.id)) return;
    const div = document.createElement('div');
    div.className = 'post';
    div.id = 'cp-' + p.id;
    let html = '';
    if (p.img) html += `<img src="${p.img}" alt="پست">`;
    html += `<div class="body">`;
    if (p.text) html += `<div class="text">${esc(p.text)}</div>`;
    html += `<div class="meta">${new Date(p.ts).toLocaleString('fa-IR')}</div></div>`;
    div.innerHTML = html;
    box.appendChild(div);
  });
  box.scrollTop = box.scrollHeight;
}

function renderUsers() {
  const box = document.getElementById('userList');
  const list = Object.values(users);
  if (!list.length) {
    box.innerHTML = '<div class="empty">هنوز کاربر دیگری آنلاین نیست</div>';
    return;
  }
  box.innerHTML = list.map(u => `
    <div class="user-item" onclick="openPv('${u.user}')">
      <div class="avatar" style="width:48px;height:48px;border-radius:50%;background:#1a1a2e;display:flex;align-items:center;justify-content:center;font-size:18px;border:2px solid rgba(255,179,0,.4)">${(u.name || u.user || '?')[0]}</div>
      <div>
        <div style="font-weight:600">${esc(u.name || u.user)}</div>
        <div style="font-size:12px;color:#aaa">${esc(u.bio || 'بدون بیو')}</div>
      </div>
    </div>
  `).join('');
}

function openPv(other) {
  currentPv = other;
  document.getElementById('userList').style.display = 'none';
  document.getElementById('pvView').style.display = 'flex';
  document.getElementById('pvTitle').textContent = 'پیوی با ' + other;
  const topic1 = T_PV + [username, other].sort().join('/') + '/#';
  client.subscribe(topic1, { qos: 1 });
  renderPvMessages(other);
}

function closePv() {
  currentPv = null;
  document.getElementById('pvView').style.display = 'none';
  document.getElementById('userList').style.display = 'block';
  renderUsers();
}

function renderPvMessages(other) {
  const box = document.getElementById('pvMsgs');
  box.innerHTML = '';
  const list = pvHistory[other] || [];
  if (!list.length) {
    box.innerHTML = '<div class="empty">هنوز پیامی رد و بدل نشده</div>';
    return;
  }
  list.forEach(m => {
    const div = document.createElement('div');
    div.className = 'msg ' + (m.from === username ? 'me' : 'other');
    div.innerHTML = `<div class="meta">${m.from === username ? 'شما' : esc(m.from)}</div><div>${esc(m.text)}</div>`;
    box.appendChild(div);
  });
  box.scrollTop = box.scrollHeight;
}

function sendPv() {
  if (!currentPv || !client) return;
  const text = document.getElementById('pvText').value.trim();
  if (!text) return;
  const msg = {
    id: Date.now() + '_' + Math.random().toString(36).slice(2, 6),
    from: username,
    to: currentPv,
    text: text,
    ts: Date.now()
  };
  const topic = T_PV + [username, currentPv].sort().join('/') + '/msg';
  client.publish(topic, JSON.stringify(msg), { qos: 1 });
  if (!pvHistory[currentPv]) pvHistory[currentPv] = [];
  pvHistory[currentPv].push(msg);
  renderPvMessages(currentPv);
  document.getElementById('pvText').value = '';
}

function saveProfile() {
  myProfile = {
    name: document.getElementById('myName').value.trim() || username,
    bio: document.getElementById('myBio').value.trim()
  };
  save();
  publishMyProfile();
  alert('پروفایل ذخیره شد');
}

function sendGroup() {
  if (banned || !groupOpen || !client || !client.connected) return;
  const text = document.getElementById('gText').value.trim();
  const prev = document.getElementById('preview');
  const img = prev.querySelector('img');
  let msg;
  if (img) {
    msg = { id: Date.now() + '_' + Math.random().toString(36).slice(2, 6), user: username, type: 'image', text: text, data: img.src, ts: Date.now() };
    prev.innerHTML = '';
    prev.style.display = 'none';
  } else if (text) {
    msg = { id: Date.now() + '_' + Math.random().toString(36).slice(2, 6), user: username, type: 'text', text: text, ts: Date.now() };
  } else return;

  client.publish(TG_LIVE, JSON.stringify(msg), { qos: 1 });
  client.publish(TG_MSG + msg.id, JSON.stringify(msg), { qos: 1, retain: true });
  document.getElementById('gText').value = '';
  document.getElementById('emojiBar').classList.remove('show');
}

function handleFile(input) {
  const file = input.files[0];
  if (!file || !file.type.startsWith('image/')) return;
  if (file.size > 400000) return alert('عکس حداکثر ۴۰۰KB باشد');
  const reader = new FileReader();
  reader.onload = e => {
    const p = document.getElementById('preview');
    p.innerHTML = `<img src="${e.target.result}">`;
    p.style.display = 'block';
  };
  reader.readAsDataURL(file);
  input.value = '';
}

function toggleEmoji() {
  document.getElementById('emojiBar').classList.toggle('show');
}

function insertEmoji(e) {
  const input = document.getElementById('gText');
  input.value += e;
  input.focus();
}

function toggleVoice() {
  if (isRecording) {
    mediaRecorder.stop();
    isRecording = false;
    document.getElementById('voiceBtn').textContent = '🎤';
    return;
  }
  navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
    mediaRecorder = new MediaRecorder(stream);
    audioChunks = [];
    mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
    mediaRecorder.onstop = () => {
      const blob = new Blob(audioChunks, { type: 'audio/webm' });
      if (blob.size > 350000) return alert('ویس خیلی طولانی است');
      const reader = new FileReader();
      reader.onload = () => {
        const msg = {
          id: Date.now() + '_' + Math.random().toString(36).slice(2, 6),
          user: username,
          type: 'voice',
          data: reader.result,
          ts: Date.now()
        };
        client.publish(TG_LIVE, JSON.stringify(msg), { qos: 1 });
        client.publish(TG_MSG + msg.id, JSON.stringify(msg), { qos: 1, retain: true });
      };
      reader.readAsDataURL(blob);
      stream.getTracks().forEach(t => t.stop());
    };
    mediaRecorder.start();
    isRecording = true;
    document.getElementById('voiceBtn').textContent = '⏹';
  }).catch(() => alert('دسترسی به میکروفون لازم است'));
}

function switchTab(tab) {
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
  document.querySelectorAll('.panel').forEach(p => p.classList.toggle('active', p.id === 'panel-' + tab));
  if (tab === 'users') renderUsers();
  if (tab === 'channels') closeChannel();
}

function esc(str) {
  return String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

// ورود خودکار
window.onload = function() {
  const saved = localStorage.getItem('t8u');
  if (saved && saved.length >= 2) {
    document.getElementById('username').value = saved;
    document.getElementById('loginHint').textContent = 'ورود خودکار...';
    setTimeout(doLogin, 300);
  }
};
